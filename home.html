
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Interior E-Decor Shop</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f5eee5;
            margin: 0;
            padding: 25px;
        }

        h1 {
            text-align: center;
            color: #70452c;
        }

        form {
            background: white;
            width: 420px;
            max-width: 90%;
            margin: auto;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ccc;
        }

        h2 {
            color: #70452c;
        }

        input:not([type="radio"]):not([type="checkbox"]),
        select {
            width: 95%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        input[type="radio"],
        input[type="checkbox"] {
            margin: 10px;
        }

        button {
            background: #805333;
            color: white;
            padding: 11px 20px;
            border: none;
            cursor: pointer;
        }

        label {
            font-weight: bold;
        }

    </style>
</head>

<body>

    <h1>INTERIOR E-DECOR SHOP</h1>

    <form action="/server" method="POST">

        <h2>Customer Registration Form</h2>

        <label>Name *</label>

        <input type="text"
               name="name"
               placeholder="Enter your name"
               required>

        <br>

        <label>Password *</label>

        <input type="password"
               name="password"
               placeholder="Enter password"
               required>

        <br>

        <label>Age *</label>

        <input type="number"
               name="age"
               min="18"
               max="100"
               required>

        <br>

        <label>Mobile Number *</label>

        <input type="tel"
               name="mobile"
               pattern="[0-9]{10}"
               maxlength="10"
               placeholder="10 digit mobile number"
               required>

        <br>

        <label>Email *</label>

        <input type="email"
               name="email"
               placeholder="Enter email"
               required>

        <br>

        <label>Gender *</label>

        <br>

        <input type="radio"
               name="gender"
               value="Male"
               required>
        Male

        <input type="radio"
               name="gender"
               value="Female">
        Female

        <br><br>

        <label>State *</label>

        <br>

        <select name="state" required>

            <option value="">Select State</option>

            <option value="Tamil Nadu">Tamil Nadu</option>

            <option value="Kerala">Kerala</option>

            <option value="Karnataka">Karnataka</option>

            <option value="Andhra Pradesh">Andhra Pradesh</option>

        </select>

        <br>

        <label>Decor Preferences</label>

        <br>

        <input type="checkbox"
               name="skills"
               value="Furniture">
        Furniture

        <input type="checkbox"
               name="skills"
               value="Wall Art">
        Wall Art

        <input type="checkbox"
               name="skills"
               value="Lighting">
        Lighting

        <input type="checkbox"
               name="skills"
               value="Accessories">
        Accessories

        <br><br>

        <button type="submit">
            Submit
        </button>

    </form>

</body>

</html>
